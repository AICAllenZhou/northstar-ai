[project]
name = "northstar"
version = "0.1.0"
description = "NORTHSTAR AI - Northern aviation resilience simulation (research prototype)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "networkx>=3.3",
    "ortools>=9.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["northstar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
